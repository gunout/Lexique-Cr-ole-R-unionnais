<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexique Créole Réunionnais - Interface Cyberpunk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="dictionnaire.js"></script>
    <script src="playlist.js"></script>
    <style>
        :root {
            --reunion-blue: #0055A4;
            --reunion-yellow: #FFCE00;
            --reunion-red: #EF4135;
            --reunion-white: #FFFFFF;
            --reunion-black: #000000;

            --bg-primary: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --bg-card: rgba(26, 26, 26, 0.7);
            --text-primary: #f0f0f0;
            --text-secondary: #b0b0b0;
            --border-color: #333;
            --neon-glow-blue: 0 0 10px #0055A4, 0 0 20px #0055A4, 0 0 30px #0055A4;
            --neon-glow-red: 0 0 10px #EF4135, 0 0 20px #EF4135, 0 0 30px #EF4135;
            --neon-glow-yellow: 0 0 10px #FFCE00, 0 0 20px #FFCE00;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
            background-image: 
                repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.15), rgba(0, 0, 0, 0.15) 1px, transparent 1px, transparent 2px);
        }

        /* ============================================================ */
        /* HEADER                                                      */
        /* ============================================================ */
        .top-header {
            background-color: var(--bg-secondary);
            padding: 1rem 1.5rem;
            border-bottom: 2px solid var(--reunion-blue);
            box-shadow: var(--neon-glow-blue);
            position: relative;
        }

        .header-top-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 0.5rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            font-family: 'Roboto Mono', monospace;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--reunion-white);
            text-shadow: var(--neon-glow-blue);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .track-banner {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--reunion-yellow);
            box-shadow: var(--neon-glow-yellow);
            padding: 0.4rem 0.8rem;
            overflow: hidden;
            min-width: 0;
            height: 38px;
            border-radius: 0;
        }

        .track-info-banner {
            color: var(--reunion-yellow);
            font-size: 0.75rem;
            font-family: 'Roboto Mono', monospace;
            text-shadow: var(--neon-glow-yellow);
            white-space: nowrap;
            flex-shrink: 0;
            font-weight: 600;
            padding-right: 0.6rem;
            border-right: 1px solid rgba(255, 206, 0, 0.3);
        }

        .track-title-mask {
            flex: 1;
            overflow: hidden;
            position: relative;
            height: 1rem;
            min-width: 0;
        }

        .track-title {
            color: var(--reunion-white);
            font-size: 0.8rem;
            font-family: 'Roboto Mono', monospace;
            white-space: nowrap;
            display: inline-block;
            opacity: 0.9;
            position: absolute;
            left: 0;
            top: 0;
            will-change: transform;
            transform: translateX(0);
        }

        .music-controls {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            flex-shrink: 0;
        }

        .music-btn {
            background: var(--bg-card);
            border: 1px solid var(--reunion-yellow);
            color: var(--reunion-yellow);
            padding: 0.4rem;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--neon-glow-yellow);
            font-size: 1rem;
        }

        .music-btn:hover {
            transform: scale(1.1);
            background: var(--reunion-yellow);
            color: var(--bg-primary);
        }

        .volume-slider {
            width: 70px;
            background: var(--bg-card);
            border: 1px solid var(--reunion-yellow);
            cursor: pointer;
        }

        .music-btn.playing {
            animation: pulse-yellow 2s infinite;
        }

        .music-loading {
            opacity: 0.7;
            cursor: wait;
        }

        @keyframes pulse-yellow {
            0% { box-shadow: 0 0 5px var(--reunion-yellow); }
            50% { box-shadow: 0 0 20px var(--reunion-yellow); }
            100% { box-shadow: 0 0 5px var(--reunion-yellow); }
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-family: 'Roboto Mono', monospace;
            letter-spacing: 1px;
            text-align: center;
        }

        .search-container {
            max-width: 600px;
            margin: 1rem auto 0;
            position: relative;
        }

        .search-bar {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.8rem 1.2rem;
            border-radius: 0;
            font-size: 1rem;
            font-family: 'Roboto Mono', monospace;
            width: 100%;
            transition: all 0.3s ease;
        }

        .search-bar:focus {
            outline: none;
            border-color: var(--reunion-blue);
            box-shadow: inset 0 0 5px var(--reunion-blue), var(--neon-glow-blue);
        }

        .search-count {
            text-align: center;
            color: var(--text-secondary);
            margin-top: 0.5rem;
            font-size: 0.8rem;
            font-family: 'Roboto Mono', monospace;
        }

        /* ============================================================ */
        /* LAYOUT PRINCIPAL                                            */
        /* ============================================================ */
        .app-container {
            display: flex;
            min-height: calc(100vh - 180px);
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem;
            gap: 1.5rem;
        }

        .sidebar {
            flex: 0 0 280px;
            background: var(--bg-card);
            padding: 1.2rem;
            border: 1px solid var(--reunion-blue);
            box-shadow: var(--neon-glow-blue);
            height: fit-content;
        }

        .sidebar h2 {
            font-size: 1.1rem;
            margin-bottom: 1.2rem;
            color: var(--reunion-yellow);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Roboto Mono', monospace;
            text-shadow: var(--neon-glow-yellow);
        }

        .alphabet-nav {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 0.4rem;
            margin-bottom: 1.5rem;
        }

        .alphabet-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.6rem;
            border-radius: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Roboto Mono', monospace;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        .alphabet-btn:hover:not(:disabled) {
            background: var(--reunion-blue);
            color: var(--reunion-white);
            box-shadow: var(--neon-glow-blue);
            transform: scale(1.05);
        }

        .alphabet-btn.active {
            background: var(--reunion-yellow);
            color: var(--bg-primary);
            font-weight: 700;
            box-shadow: var(--neon-glow-yellow);
        }
        
        .alphabet-btn:disabled {
            opacity: 0.2;
            cursor: not-allowed;
        }

        .stats {
            background: var(--bg-secondary);
            padding: 0.8rem;
            border: 1px solid var(--border-color);
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.6rem;
            font-size: 0.8rem;
            font-family: 'Roboto Mono', monospace;
        }

        .stat-value {
            color: var(--reunion-yellow);
            font-weight: 600;
            text-shadow: var(--neon-glow-yellow);
        }

        .main-content {
            flex: 1;
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.8rem;
        }

        .content-header h2 {
            font-family: 'Roboto Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-primary);
            font-size: 1.1rem;
        }

        .view-toggle {
            display: flex;
            gap: 0;
            background: var(--bg-secondary);
            border: 1px solid var(--reunion-blue);
            box-shadow: var(--neon-glow-blue);
        }

        .view-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 0.6rem 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Roboto Mono', monospace;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        .view-btn.active {
            background: var(--reunion-blue);
            color: var(--reunion-white);
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
        }

        .word-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.2rem;
            animation: fadeIn 0.5s ease-in-out;
        }

        .word-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 1.2rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .word-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, var(--reunion-blue), var(--reunion-yellow));
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s ease;
        }

        .word-card:hover::before {
            transform: scaleX(1);
        }

        .word-card:hover {
            transform: translateY(-5px);
            border-color: var(--reunion-blue);
            box-shadow: var(--neon-glow-blue);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.8rem;
        }

        .word-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 0.2rem;
            font-family: 'Roboto Mono', monospace;
            color: var(--reunion-yellow);
            text-shadow: var(--neon-glow-yellow);
        }

        .word-meta {
            color: var(--text-secondary);
            font-size: 0.7rem;
            font-family: 'Roboto Mono', monospace;
            text-transform: uppercase;
        }

        .card-actions {
            display: flex;
            gap: 0.4rem;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.2s ease;
        }

        .icon-btn:hover {
            color: var(--reunion-red);
            transform: scale(1.2);
            filter: drop-shadow(0 0 5px var(--reunion-red));
        }

        .icon-btn.active {
            color: var(--reunion-red);
            animation: pulse-red 1.5s infinite;
        }

        .definition {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.5;
            flex-grow: 1;
        }

        .word-list {
            display: none;
            animation: fadeIn 0.5s ease-in-out;
        }

        .word-list.active {
            display: block;
        }

        .list-item {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 1.2rem;
            margin-bottom: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .list-item:hover {
            border-color: var(--reunion-blue);
            transform: translateX(10px);
            box-shadow: var(--neon-glow-blue);
        }

        .list-word {
            font-size: 1.1rem;
            font-weight: 600;
            font-family: 'Roboto Mono', monospace;
            color: var(--reunion-yellow);
            text-shadow: var(--neon-glow-yellow);
        }

        .list-definition {
            color: var(--text-secondary);
            font-size: 0.85rem;
            max-width: 60%;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            animation: fadeIn 0.4s;
        }

        .modal-content {
            background-color: var(--bg-secondary);
            margin: 5% auto;
            padding: 1.5rem;
            border: 2px solid var(--reunion-yellow);
            box-shadow: var(--neon-glow-yellow);
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideIn 0.4s;
            position: relative;
        }

        .close-btn {
            color: var(--text-secondary);
            position: absolute;
            top: 1rem;
            right: 1.5rem;
            font-size: 1.8rem;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: var(--reunion-red);
            filter: drop-shadow(0 0 5px var(--reunion-red));
        }

        .modal-word {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            font-family: 'Roboto Mono', monospace;
            color: var(--reunion-yellow);
            text-shadow: var(--neon-glow-yellow);
        }

        .modal-definition {
            font-size: 1rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        .modal-actions {
            display: flex;
            gap: 0.8rem;
            margin-top: 1.5rem;
        }

        .btn {
            background: var(--reunion-blue);
            color: var(--reunion-white);
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 0;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Roboto Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: var(--neon-glow-blue);
            font-size: 0.8rem;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 15px var(--reunion-blue), 0 0 25px var(--reunion-blue);
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            box-shadow: none;
        }
        
        .btn-secondary:hover {
            border-color: var(--reunion-red);
            box-shadow: var(--neon-glow-red);
        }

        .voice-controls {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-top: 1.2rem;
        }

        .voice-select {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.4rem;
            border-radius: 0;
            font-family: 'Roboto Mono', monospace;
            font-size: 0.8rem;
        }

        .back-to-top {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--reunion-blue);
            color: var(--reunion-white);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: var(--neon-glow-blue);
            transition: all 0.3s ease;
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .back-to-top:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 20px var(--reunion-blue);
        }

        .back-to-top.show {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes pulse-red {
            0% { filter: drop-shadow(0 0 5px var(--reunion-red)); }
            50% { filter: drop-shadow(0 0 15px var(--reunion-red)); }
            100% { filter: drop-shadow(0 0 5px var(--reunion-red)); }
        }

        @media (max-width: 1024px) {
            .app-container {
                flex-direction: column;
                padding: 1rem;
                gap: 1rem;
            }

            .sidebar {
                width: 100%;
                flex: none;
            }

            .alphabet-nav {
                grid-template-columns: repeat(8, 1fr);
            }

            .word-grid {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            }
        }

        @media (max-width: 768px) {
            .top-header {
                padding: 0.8rem 1rem;
            }

            .header-top-row {
                flex-direction: column;
                gap: 0.5rem;
            }

            .track-banner {
                width: 100%;
                order: 3;
            }

            .music-controls {
                order: 2;
            }

            .logo {
                order: 1;
                font-size: 1.3rem;
            }

            .subtitle {
                font-size: 0.8rem;
            }

            .search-container {
                margin: 1rem auto 0;
            }

            .search-bar {
                padding: 0.7rem 1rem;
                font-size: 0.9rem;
            }

            .alphabet-nav {
                grid-template-columns: repeat(6, 1fr);
            }

            .word-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .content-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.8rem;
            }

            .view-toggle {
                width: 100%;
                justify-content: center;
            }

            .view-btn {
                flex: 1;
                text-align: center;
            }

            .list-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
            }

            .list-definition {
                max-width: 100%;
            }

            .modal-content {
                padding: 1.2rem;
                margin: 10% auto;
                width: 95%;
            }

            .modal-word {
                font-size: 1.8rem;
            }

            .modal-definition {
                font-size: 0.95rem;
            }

            .modal-actions {
                flex-direction: column;
            }

            .voice-controls {
                flex-direction: column;
                align-items: stretch;
            }

            .back-to-top {
                bottom: 15px;
                right: 15px;
                width: 45px;
                height: 45px;
                font-size: 1.3rem;
            }
        }

        @media (max-width: 480px) {
            .top-header {
                padding: 0.6rem 0.8rem;
            }

            .logo {
                font-size: 1.1rem;
                letter-spacing: 1px;
            }

            .track-banner {
                height: 34px;
                padding: 0.3rem 0.6rem;
            }

            .track-info-banner {
                font-size: 0.7rem;
            }

            .track-title {
                font-size: 0.75rem;
            }

            .music-btn {
                width: 32px;
                height: 32px;
                font-size: 0.9rem;
            }

            .volume-slider {
                width: 60px;
            }

            .search-bar {
                padding: 0.6rem 0.8rem;
            }

            .alphabet-nav {
                grid-template-columns: repeat(4, 1fr);
            }

            .alphabet-btn {
                padding: 0.5rem;
                font-size: 0.7rem;
            }

            .sidebar {
                padding: 1rem;
            }

            .sidebar h2 {
                font-size: 1rem;
            }

            .word-card {
                padding: 1rem;
            }

            .word-title {
                font-size: 1.2rem;
            }

            .definition {
                font-size: 0.85rem;
            }

            .back-to-top {
                bottom: 10px;
                right: 10px;
                width: 40px;
                height: 40px;
                font-size: 1.2rem;
            }
        }

        @media (max-width: 360px) {
            .alphabet-nav {
                grid-template-columns: repeat(3, 1fr);
            }

            .word-grid {
                grid-template-columns: 1fr;
            }

            .modal-content {
                padding: 1rem;
                margin: 5% auto;
            }

            .modal-word {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <audio id="background-music"></audio>

    <header class="top-header">
        <div class="header-top-row">
            <div class="logo">🗣️ Lexique Créole</div>
            
            <div class="track-banner">
                <span id="track-info" class="track-info-banner">0/0</span>
                <div class="track-title-mask">
                    <span id="track-title" class="track-title">Chargement...</span>
                </div>
            </div>
            
            <div class="music-controls">
                <button id="prev-btn" class="music-btn" title="Piste précédente">⏮</button>
                <button id="music-toggle" class="music-btn" title="Activer/Désactiver la musique">🎵</button>
                <button id="next-btn" class="music-btn" title="Piste suivante">⏭</button>
                <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.1" value="0.3" title="Volume">
            </div>
        </div>
        
        <div class="subtitle">Dictionnaire interactif  // <span id="total-words">0</span> mots dans la base</div>
        
        <div class="search-container">
            <input type="search" id="search-input" class="search-bar" placeholder="Rechercher un mot créole...">
            <div class="search-count" id="search-count">Tapez pour rechercher</div>
        </div>
    </header>

    <div class="app-container">
        <aside class="sidebar">
            <h2>Navigation</h2>
            
            <div class="alphabet-nav" id="alphabet-nav"></div>

            <div class="stats">
                <div class="stat-item">
                    <span>Mots affichés:</span>
                    <span class="stat-value" id="displayed-count">0</span>
                </div>
                <div class="stat-item">
                    <span>Favoris:</span>
                    <span class="stat-value" id="favorites-count">0</span>
                </div>
                <div class="stat-item">
                    <span>Lettre active:</span>
                    <span class="stat-value" id="active-letter">Toutes</span>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <div class="content-header">
                <h2 id="current-view-title">Tous les mots</h2>
                <div class="view-toggle">
                    <button class="view-btn active" data-view="grid">Grille</button>
                    <button class="view-btn" data-view="list">Liste</button>
                </div>
            </div>

            <div class="word-grid" id="word-grid"></div>
            <div class="word-list" id="word-list"></div>
        </main>
    </div>

    <button class="back-to-top" id="back-to-top" title="Remonter en haut">↑</button>

    <div id="word-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div class="modal-body">
                <h1 class="modal-word" id="modal-word"></h1>
                <p class="modal-definition" id="modal-definition"></p>
                
                <div class="voice-controls">
                    <select id="voice-select" class="voice-select">
                        <option value="">Choisir une voix</option>
                    </select>
                    <button class="btn" id="speak-btn">🔊 Prononcer</button>
                </div>
                
                <div class="modal-actions">
                    <button class="btn-secondary" id="favorite-modal-btn">❤️ Ajouter aux favoris</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // DONNÉES DU DICTIONNAIRE
        // ============================================================
        const wordsArray = Object.entries(dictionnaire).map(([word, definition], index) => ({
            id: index,
            word: word,
            definition: definition,
            firstLetter: word.charAt(0).toUpperCase()
        }));

        // ============================================================
        // ÉLÉMENTS DU DOM
        // ============================================================
        const searchInput = document.getElementById('search-input');
        const searchCount = document.getElementById('search-count');
        const totalWords = document.getElementById('total-words');
        const displayedCount = document.getElementById('displayed-count');
        const favoritesCount = document.getElementById('favorites-count');
        const activeLetter = document.getElementById('active-letter');
        const alphabetNav = document.getElementById('alphabet-nav');
        const wordGrid = document.getElementById('word-grid');
        const wordList = document.getElementById('word-list');
        const viewBtns = document.querySelectorAll('.view-btn');
        const modal = document.getElementById('word-modal');
        const modalWord = document.getElementById('modal-word');
        const modalDefinition = document.getElementById('modal-definition');
        const favoriteModalBtn = document.getElementById('favorite-modal-btn');
        const speakBtn = document.getElementById('speak-btn');
        const voiceSelect = document.getElementById('voice-select');
        const currentViewTitle = document.getElementById('current-view-title');
        const backToTopBtn = document.getElementById('back-to-top');

        // Éléments musique
        const backgroundMusic = document.getElementById('background-music');
        const musicToggle = document.getElementById('music-toggle');
        const volumeSlider = document.getElementById('volume-slider');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const trackInfo = document.getElementById('track-info');
        const trackTitle = document.getElementById('track-title');

        // ============================================================
        // ÉTAT DE L'APPLICATION
        // ============================================================
        let currentWords = [...wordsArray];
        let currentLetter = 'all';
        let currentView = 'grid';
        let favorites = JSON.parse(localStorage.getItem('creoleFavorites')) || [];
        let currentModalWord = null;
        let voices = [];
        let selectedVoice = null;
        let isMusicPlaying = false;

        // ============================================================
        // PLAYLIST LOCALE
        // ============================================================
        let PLAYLIST = [];
        let PLAYLIST_TITLES = [];
        let playlistChargee = false;
        let currentTrackIndex = 0;

        const BASE_URL = 'https://radio-gleaphe.duckdns.org';

        function chargerPlaylist() {
            try {
                console.log("🎵 Chargement de la playlist locale...");
                musicToggle.classList.add('music-loading');
                musicToggle.textContent = '⏳';
                musicToggle.title = 'Chargement de la playlist...';
                trackTitle.textContent = 'Chargement...';
                
                if (typeof PLAYLIST_DATA === 'undefined' || !Array.isArray(PLAYLIST_DATA)) {
                    throw new Error("PLAYLIST_DATA non trouvée. Vérifiez que playlist.js est bien chargé.");
                }
                
                const data = PLAYLIST_DATA;
                console.log(`📦 ${data.length} pistes reçues`);
                
                PLAYLIST = [];
                PLAYLIST_TITLES = [];
                
                for (const track of data) {
                    let url = track.file || track.path || track.url;
                    if (!url) continue;
                    
                    if (url.startsWith('/')) {
                        url = BASE_URL + url;
                    } else if (!url.startsWith('http')) {
                        url = BASE_URL + '/' + url;
                    }
                    
                    PLAYLIST.push(url);
                    PLAYLIST_TITLES.push(track.title || 'Sans titre');
                }
                
                if (PLAYLIST.length === 0) {
                    throw new Error("Aucune piste valide dans la réponse");
                }
                
                console.log(`✅ ${PLAYLIST.length} pistes chargées`);
                
                playlistChargee = true;
                trackInfo.textContent = `1/${PLAYLIST.length}`;
                musicToggle.classList.remove('music-loading');
                musicToggle.textContent = '▶️';
                musicToggle.title = 'Musique prête - Cliquer pour démarrer';
                
                currentTrackIndex = 0;
                updateTrackInfo();
                loadTrack(currentTrackIndex);
                
                window.addEventListener('resize', () => {
                    setTimeout(updateTrackInfo, 200);
                });
                
            } catch (error) {
                console.error("❌ Erreur chargement playlist:", error);
                musicToggle.classList.remove('music-loading');
                musicToggle.textContent = '❌';
                musicToggle.title = `Erreur : ${error.message}`;
                trackTitle.textContent = 'Erreur de chargement';
            }
        }

        // ============================================================
        // DÉFILEMENT JAVASCRIPT PUR (requestAnimationFrame)
        // ============================================================
        let defilementAnimationId = null;
        let defilementEnPause = false;

        function arreterDefilement() {
            if (defilementAnimationId !== null) {
                cancelAnimationFrame(defilementAnimationId);
                defilementAnimationId = null;
            }
        }

        function demarrerDefilement() {
            arreterDefilement();
            
            const masque = document.querySelector('.track-title-mask');
            if (!masque) return;
            
            const largeurMasque = masque.clientWidth;
            const largeurTexte = trackTitle.scrollWidth;
            
            // Si le texte est plus court que le masque, on ne défile pas
            if (largeurTexte <= largeurMasque) {
                trackTitle.style.transform = 'translateX(0)';
                console.log('⏸️ Titre court, pas de défilement');
                return;
            }
            
            console.log(`✅ Défilement ACTIVÉ (texte ${largeurTexte}px > masque ${largeurMasque}px)`);
            
            // Position de départ : à droite du masque
            let position = largeurMasque;
            
            // Vitesse en pixels par seconde (ajustable)
            const vitesse = 50;
            let dernierTemps = performance.now();
            
            function animer(tempsActuel) {
                if (defilementEnPause) {
                    dernierTemps = tempsActuel;
                    defilementAnimationId = requestAnimationFrame(animer);
                    return;
                }
                
                const deltaSecondes = (tempsActuel - dernierTemps) / 1000;
                dernierTemps = tempsActuel;
                
                position -= vitesse * deltaSecondes;
                
                // Quand le texte est complètement sorti à gauche, on recommence à droite
                if (position < -largeurTexte) {
                    position = largeurMasque;
                }
                
                trackTitle.style.transform = `translateX(${position}px)`;
                defilementAnimationId = requestAnimationFrame(animer);
            }
            
            defilementAnimationId = requestAnimationFrame(animer);
        }

        function updateTrackInfo() {
            if (!playlistChargee || PLAYLIST.length === 0) {
                trackInfo.textContent = '0/0';
                trackTitle.textContent = '-';
                arreterDefilement();
                return;
            }
            
            // Arrêter l'ancien défilement
            arreterDefilement();
            
            trackInfo.textContent = `${currentTrackIndex + 1}/${PLAYLIST.length}`;
            
            let titre = PLAYLIST_TITLES[currentTrackIndex] || 'Sans titre';
            titre = titre
                .replace(/_-_cd_-_hq.*$/, '')
                .replace(/_-_cd_.*$/, '')
                .replace(/_/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
            
            trackTitle.textContent = titre;
            trackTitle.title = PLAYLIST_TITLES[currentTrackIndex];
            trackTitle.style.transform = 'translateX(0)';
            
            // Attendre que le DOM soit prêt pour mesurer
            setTimeout(() => {
                demarrerDefilement();
            }, 150);
        }

        // Pause au survol du bandeau
        document.addEventListener('mouseover', (e) => {
            if (e.target.closest('.track-banner')) {
                defilementEnPause = true;
            }
        });

        document.addEventListener('mouseout', (e) => {
            if (e.target.closest('.track-banner')) {
                defilementEnPause = false;
            }
        });

        // ============================================================
        // LECTEUR AUDIO
        // ============================================================
        function loadTrack(index) {
            if (!playlistChargee || PLAYLIST.length === 0) {
                console.warn("Playlist non chargée");
                return;
            }
            
            console.log(`Chargement piste ${index + 1}/${PLAYLIST.length}: ${PLAYLIST_TITLES[index]}`);
            
            musicToggle.classList.add('music-loading');
            musicToggle.textContent = '⏳';
            
            backgroundMusic.src = PLAYLIST[index];
            backgroundMusic.load();
            
            backgroundMusic.addEventListener('canplaythrough', function onCanPlay() {
                backgroundMusic.removeEventListener('canplaythrough', onCanPlay);
                musicToggle.textContent = '▶️';
                musicToggle.title = 'Musique prête - Cliquer pour démarrer';
                musicToggle.classList.remove('music-loading');
                updateTrackInfo();
                
                if (isMusicPlaying) {
                    playMusic();
                }
            }, { once: true });
        }

        function nextTrack() {
            arreterDefilement();
            if (!playlistChargee || PLAYLIST.length === 0) return;
            currentTrackIndex = (currentTrackIndex + 1) % PLAYLIST.length;
            loadTrack(currentTrackIndex);
        }

        function previousTrack() {
            arreterDefilement();
            if (!playlistChargee || PLAYLIST.length === 0) return;
            currentTrackIndex = (currentTrackIndex - 1 + PLAYLIST.length) % PLAYLIST.length;
            loadTrack(currentTrackIndex);
        }

        function toggleMusic() {
            if (isMusicPlaying) {
                pauseMusic();
            } else {
                playMusic();
            }
        }

        function playMusic() {
            if (!backgroundMusic.src && playlistChargee) {
                loadTrack(currentTrackIndex);
            }

            const playPromise = backgroundMusic.play();
            
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    isMusicPlaying = true;
                    musicToggle.textContent = '🔊';
                    musicToggle.classList.add('playing');
                    musicToggle.title = 'Musique en cours - Cliquer pour arrêter';
                    localStorage.setItem('creoleMusicState', 'playing');
                }).catch(error => {
                    console.error("Erreur de lecture:", error);
                    musicToggle.textContent = '▶️';
                    musicToggle.title = 'Cliquer pour démarrer la musique';
                });
            }
        }

        function pauseMusic() {
            backgroundMusic.pause();
            isMusicPlaying = false;
            musicToggle.textContent = '▶️';
            musicToggle.classList.remove('playing');
            musicToggle.title = 'Musique arrêtée - Cliquer pour démarrer';
            localStorage.setItem('creoleMusicState', 'paused');
        }

        function setupMusicControls() {
            const savedVolume = localStorage.getItem('creoleMusicVolume');
            if (savedVolume) {
                backgroundMusic.volume = savedVolume;
                volumeSlider.value = savedVolume;
            } else {
                backgroundMusic.volume = volumeSlider.value;
            }
            
            chargerPlaylist();
            
            musicToggle.addEventListener('click', toggleMusic);
            prevBtn.addEventListener('click', previousTrack);
            nextBtn.addEventListener('click', nextTrack);
            
            volumeSlider.addEventListener('input', function() {
                const volume = this.value;
                backgroundMusic.volume = volume;
                localStorage.setItem('creoleMusicVolume', volume);
            });
            
            backgroundMusic.addEventListener('ended', nextTrack);
            
            backgroundMusic.addEventListener('error', function(e) {
                console.error("Erreur audio sur la piste:", PLAYLIST[currentTrackIndex]);
                setTimeout(nextTrack, 1000);
            });
            
            const savedMusicState = localStorage.getItem('creoleMusicState');
            if (savedMusicState === 'playing') {
                musicToggle.textContent = '▶️';
                musicToggle.title = 'Musique prête - Cliquer pour démarrer';
            }
        }

        // ============================================================
        // SYNTHÈSE VOCALE
        // ============================================================
        function loadVoices() {
            voices = speechSynthesis.getVoices();
            voiceSelect.innerHTML = '<option value="">Choisir une voix</option>';
            
            const frenchFemaleVoices = voices.filter(voice => {
                return (voice.lang.includes('fr') || voice.lang.includes('FR')) && 
                       (voice.name.toLowerCase().includes('female') || 
                        voice.name.toLowerCase().includes('femme') ||
                        voice.name.toLowerCase().includes('victoria') ||
                        voice.name.toLowerCase().includes('audrey') ||
                        voice.name.toLowerCase().includes('chantal'));
            });
            
            frenchFemaleVoices.forEach(voice => {
                const option = document.createElement('option');
                option.value = voice.name;
                option.textContent = `${voice.name} (${voice.lang})`;
                voiceSelect.appendChild(option);
            });
            
            if (frenchFemaleVoices.length === 0) {
                const frenchVoices = voices.filter(voice => voice.lang.includes('fr') || voice.lang.includes('FR'));
                frenchVoices.forEach(voice => {
                    const option = document.createElement('option');
                    option.value = voice.name;
                    option.textContent = `${voice.name} (${voice.lang})`;
                    voiceSelect.appendChild(option);
                });
            }
            
            if (frenchFemaleVoices.length > 0) {
                selectedVoice = frenchFemaleVoices[0];
                voiceSelect.value = selectedVoice.name;
            } else if (voices.length > 0) {
                const frenchVoices = voices.filter(voice => voice.lang.includes('fr') || voice.lang.includes('FR'));
                if (frenchVoices.length > 0) {
                    selectedVoice = frenchVoices[0];
                    voiceSelect.value = selectedVoice.name;
                }
            }
        }

        // ============================================================
        // INITIALISATION
        // ============================================================
        function init() {
            totalWords.textContent = wordsArray.length;
            updateFavoritesCount();
            createAlphabetNav();
            filterWords();
            setupMusicControls();
            
            if (speechSynthesis.onvoiceschanged !== undefined) {
                speechSynthesis.onvoiceschanged = loadVoices;
            }
            loadVoices();
            setupEventListeners();
            setupBackToTop();
            
            document.addEventListener('click', function initAudio() {
                const savedMusicState = localStorage.getItem('creoleMusicState');
                if (savedMusicState === 'playing' && !isMusicPlaying) {
                    setTimeout(() => playMusic(), 500);
                }
            }, { once: true });
        }

        function createAlphabetNav() {
            const allBtn = document.createElement('button');
            allBtn.className = 'alphabet-btn active';
            allBtn.textContent = 'Tous';
            allBtn.dataset.letter = 'all';
            alphabetNav.appendChild(allBtn);

            const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
            letters.forEach(letter => {
                const btn = document.createElement('button');
                btn.className = 'alphabet-btn';
                btn.textContent = letter;
                btn.dataset.letter = letter;
                
                const hasWords = wordsArray.some(word => word.firstLetter === letter);
                if (!hasWords) {
                    btn.disabled = true;
                }
                
                alphabetNav.appendChild(btn);
            });

            alphabetNav.addEventListener('click', (e) => {
                if (e.target.classList.contains('alphabet-btn') && !e.target.disabled) {
                    const letter = e.target.dataset.letter;
                    
                    document.querySelectorAll('.alphabet-btn').forEach(btn => {
                        btn.classList.remove('active');
                    });
                    e.target.classList.add('active');
                    
                    currentLetter = letter;
                    activeLetter.textContent = letter === 'all' ? 'Toutes' : letter;
                    filterWords();
                }
            });
        }

        function filterWords() {
            const searchTerm = searchInput.value.toLowerCase().trim();
            
            let filtered = currentLetter === 'all' 
                ? wordsArray 
                : wordsArray.filter(word => word.firstLetter === currentLetter);
            
            if (searchTerm) {
                filtered = filtered.filter(word => 
                    word.word.toLowerCase().includes(searchTerm)
                );
            }
            
            currentWords = filtered;
            renderWords();
            
            if (searchTerm) {
                searchCount.textContent = `${currentWords.length} mot(s) créole(s) trouvé(s) pour "${searchTerm}"`;
            } else if (currentLetter === 'all') {
                searchCount.textContent = 'Tous les mots créoles affichés';
            } else {
                searchCount.textContent = `${currentWords.length} mot(s) créole(s) commençant par "${currentLetter}"`;
            }
        }

        function renderWords() {
            displayedCount.textContent = currentWords.length;
            
            wordGrid.innerHTML = '';
            wordList.innerHTML = '';
            
            if (currentWords.length === 0) {
                const message = document.createElement('div');
                message.style.gridColumn = '1 / -1';
                message.style.textAlign = 'center';
                message.style.padding = '2rem';
                message.style.color = 'var(--text-secondary)';
                message.style.fontSize = '1rem';
                message.textContent = 'Aucun mot créole ne correspond à votre recherche.';
                wordGrid.appendChild(message);
                
                const listMessage = message.cloneNode(true);
                wordList.appendChild(listMessage);
                return;
            }
            
            if (currentView === 'grid') {
                renderGridView();
                wordGrid.style.display = 'grid';
                wordList.style.display = 'none';
            } else {
                renderListView();
                wordGrid.style.display = 'none';
                wordList.style.display = 'block';
            }
        }

        function renderGridView() {
            currentWords.forEach(word => {
                const card = createWordCard(word);
                wordGrid.appendChild(card);
            });
        }

        function renderListView() {
            currentWords.forEach(word => {
                const listItem = createListItem(word);
                wordList.appendChild(listItem);
            });
        }

        function createWordCard(word) {
            const card = document.createElement('div');
            card.className = 'word-card';
            card.innerHTML = `
                <div class="card-header">
                    <div>
                        <div class="word-title">${word.word}</div>
                        <div class="word-meta">Première lettre: ${word.firstLetter}</div>
                    </div>
                    <div class="card-actions">
                        <button class="icon-btn favorite-btn ${favorites.includes(word.id) ? 'active' : ''}" 
                                data-id="${word.id}" title="Favori">❤️</button>
                    </div>
                </div>
                <div class="definition">${word.definition}</div>
            `;
            
            card.addEventListener('click', (e) => {
                if (!e.target.classList.contains('favorite-btn')) {
                    openModal(word);
                }
            });
            
            return card;
        }

        function createListItem(word) {
            const item = document.createElement('div');
            item.className = 'list-item';
            item.innerHTML = `
                <div class="list-word">${word.word}</div>
                <div class="list-definition">${word.definition}</div>
                <button class="icon-btn favorite-btn ${favorites.includes(word.id) ? 'active' : ''}" 
                        data-id="${word.id}" title="Favori">❤️</button>
            `;
            
            item.addEventListener('click', (e) => {
                if (!e.target.classList.contains('favorite-btn')) {
                    openModal(word);
                }
            });
            
            return item;
        }

        function openModal(word) {
            currentModalWord = word;
            modalWord.textContent = word.word;
            modalDefinition.textContent = word.definition;
            
            favoriteModalBtn.textContent = favorites.includes(word.id) 
                ? '❤️ Retirer des favoris' 
                : '❤️ Ajouter aux favoris';
            
            modal.style.display = 'block';
        }

        function closeModal() {
            modal.style.display = 'none';
            currentModalWord = null;
        }

        function toggleFavorite(wordId) {
            if (favorites.includes(wordId)) {
                favorites = favorites.filter(id => id !== wordId);
            } else {
                favorites.push(wordId);
            }
            
            localStorage.setItem('creoleFavorites', JSON.stringify(favorites));
            updateFavoritesCount();
            renderWords();
            
            if (currentModalWord && currentModalWord.id === wordId) {
                favoriteModalBtn.textContent = favorites.includes(wordId) 
                    ? '❤️ Retirer des favoris' 
                    : '❤️ Ajouter aux favoris';
            }
        }

        function updateFavoritesCount() {
            favoritesCount.textContent = favorites.length;
        }

        function speakWord(word) {
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
                
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.9;
                utterance.pitch = 1.1;
                utterance.volume = 1.0;
                
                if (selectedVoice) {
                    utterance.voice = selectedVoice;
                } else {
                    const frenchFemaleVoices = speechSynthesis.getVoices().filter(voice => {
                        return (voice.lang.includes('fr') || voice.lang.includes('FR')) && 
                               (voice.name.toLowerCase().includes('female') || 
                                voice.name.toLowerCase().includes('femme'));
                    });
                    
                    if (frenchFemaleVoices.length > 0) {
                        utterance.voice = frenchFemaleVoices[0];
                    }
                }
                
                speechSynthesis.speak(utterance);
            } else {
                alert('La synthèse vocale n\'est pas supportée par votre navigateur.');
            }
        }

        function setupBackToTop() {
            window.addEventListener('scroll', () => {
                if (window.pageYOffset > 300) {
                    backToTopBtn.classList.add('show');
                } else {
                    backToTopBtn.classList.remove('show');
                }
            });
            
            backToTopBtn.addEventListener('click', () => {
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            });
        }

        function setupEventListeners() {
            searchInput.addEventListener('input', filterWords);
            
            viewBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const view = btn.dataset.view;
                    
                    viewBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    
                    currentView = view;
                    currentViewTitle.textContent = view === 'grid' ? 'Tous les mots' : 'Liste des mots';
                    
                    renderWords();
                });
            });
            
            document.addEventListener('click', (e) => {
                if (e.target.classList.contains('favorite-btn')) {
                    e.stopPropagation();
                    const wordId = parseInt(e.target.dataset.id);
                    toggleFavorite(wordId);
                }
            });
            
            document.querySelector('.close-btn').addEventListener('click', closeModal);
            window.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });
            
            favoriteModalBtn.addEventListener('click', () => {
                if (currentModalWord) {
                    toggleFavorite(currentModalWord.id);
                }
            });
            
            speakBtn.addEventListener('click', () => {
                if (currentModalWord) {
                    speakWord(currentModalWord.word);
                }
            });
            
            voiceSelect.addEventListener('change', () => {
                const selectedVoiceName = voiceSelect.value;
                if (selectedVoiceName) {
                    selectedVoice = voices.find(voice => voice.name === selectedVoiceName);
                } else {
                    selectedVoice = null;
                }
            });
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
